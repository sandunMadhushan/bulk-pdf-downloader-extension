<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bulk PDF Grabber</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1 id="titleText">Bulk PDF Grabber</h1>
    <button id="rescanBtn" title="Re-scan this page">⟳</button>
  </header>

  <div id="controls">
    <label class="selectAllRow">
      <input type="checkbox" id="selectAllCheckbox" />
      <span id="countLabel">0 PDFs found</span>
    </label>
    <input type="text" id="filterInput" placeholder="Filter by name or folder…" />
    <div id="typeChips" class="hidden">
      <button class="chip active" data-type="all">All</button>
      <button class="chip" data-type="pdf">PDF</button>
      <button class="chip" data-type="doc">Docs</button>
      <button class="chip" data-type="slides">Slides</button>
      <button class="chip" data-type="sheet">Sheets</button>
      <button class="chip" data-type="unknown">Other</button>
    </div>
    <button id="deepScanBtn" class="hidden">Deep scan (expand + scroll page)</button>
  </div>

  <div id="listContainer">
    <ul id="pdfList"></ul>
    <p id="emptyState">Scanning page…</p>
  </div>

  <div id="failuresBox" class="hidden">
    <p id="failuresHeading"></p>
    <ul id="failuresList"></ul>
  </div>

  <footer>
    <span id="statusText"></span>
    <button id="downloadBtn" disabled>Download selected (0)</button>
  </footer>
  <div id="credit">Made by <a href="https://github.com/sandunMadhushan" target="_blank" rel="noopener">Sandun Madhushan</a></div>

  <script src="popup.js"></script>
</body>
</html>
